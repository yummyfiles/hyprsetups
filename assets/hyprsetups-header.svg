<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
<rect width="900" height="180" rx="18" fill="#000"/>
<rect x="1" y="1" width="898" height="178" rx="17" fill="none" stroke="#fff" stroke-opacity=".25">
  <animate attributeName="stroke-opacity" values=".18;.35;.18" dur="4s" repeatCount="indefinite"/>
</rect>
<text x="450" y="78" text-anchor="middle" fill="#fff" font-family="monospace" font-size="38" font-weight="700" letter-spacing="4">HYPRSETUPS
  <animate attributeName="opacity" values=".78;1;.78" dur="4s" repeatCount="indefinite"/>
</text>
<text x="450" y="112" text-anchor="middle" fill="#fff" fill-opacity=".65" font-family="monospace" font-size="15" letter-spacing="2">// HYPRLAND RICE COLLECTION
  <animate attributeName="opacity" values=".45;.75;.45" dur="4s" repeatCount="indefinite"/>
</text>
<path d="M120 140H780" stroke="#fff" stroke-opacity=".3"/>
<circle r="3" fill="#fff">
  <animateMotion dur="6s" repeatCount="indefinite" path="M120 140H780"/>
  <animate attributeName="r" values="2;4;2" dur="1.5s" repeatCount="indefinite"/>
</circle>
<circle r="3" fill="#fff">
  <animateMotion dur="6s" begin="3s" repeatCount="indefinite" path="M780 140H120"/>
  <animate attributeName="r" values="2;4;2" dur="1.5s" begin=".75s" repeatCount="indefinite"/>
</circle>
<g fill="#fff" opacity=".55"><circle cx="42" cy="42" r="2"/><circle cx="858" cy="42" r="2"/><circle cx="42" cy="138" r="2"/><circle cx="858" cy="138" r="2"/></g>
</svg>
