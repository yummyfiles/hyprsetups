<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
<rect width="900" height="180" rx="18" fill="#000"/>
<rect x="1" y="1" width="898" height="178" rx="17" fill="none" stroke="#fff" stroke-opacity=".25">
  <animate attributeName="stroke-opacity" values=".18;.35;.18" dur="4s" repeatCount="indefinite"/>
</rect>

<!-- original corner dots -->
<g fill="#fff" opacity=".55">
  <circle cx="42" cy="42" r="2"><animate attributeName="cx" values="42;47;39;44;42" dur="9s" repeatCount="indefinite"/><animate attributeName="cy" values="42;37;45;40;42" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="858" cy="42" r="2"><animate attributeName="cx" values="858;852;861;855;858" dur="11s" repeatCount="indefinite"/><animate attributeName="cy" values="42;47;38;44;42" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="42" cy="138" r="2"><animate attributeName="cx" values="42;38;47;40;42" dur="10s" repeatCount="indefinite"/><animate attributeName="cy" values="138;132;142;136;138" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="858" cy="138" r="2"><animate attributeName="cx" values="858;864;852;861;858" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="138;143;133;140;138" dur="11s" repeatCount="indefinite"/></circle>
</g>

<!-- random drifting background dots -->
<g fill="#fff">
  <circle cx="90" cy="62" r="1.4" opacity=".28"><animateTransform attributeName="transform" type="translate" values="0 0;18 8;-8 20;12 -6;0 0" dur="18s" repeatCount="indefinite"/></circle>
  <circle cx="155" cy="115" r="1.8" opacity=".36"><animateTransform attributeName="transform" type="translate" values="0 0;-15 12;8 -18;20 5;0 0" dur="21s" repeatCount="indefinite"/></circle>
  <circle cx="220" cy="35" r="1.2" opacity=".24"><animateTransform attributeName="transform" type="translate" values="0 0;10 -12;-14 9;6 18;0 0" dur="16s" repeatCount="indefinite"/></circle>
  <circle cx="310" cy="130" r="1.6" opacity=".3"><animateTransform attributeName="transform" type="translate" values="0 0;22 -8;4 15;-16 -5;0 0" dur="23s" repeatCount="indefinite"/></circle>
  <circle cx="365" cy="48" r="1.3" opacity=".25"><animateTransform attributeName="transform" type="translate" values="0 0;-18 -5;12 16;-7 8;0 0" dur="19s" repeatCount="indefinite"/></circle>
  <circle cx="440" cy="25" r="1.7" opacity=".3"><animateTransform attributeName="transform" type="translate" values="0 0;9 15;-12 4;16 -10;0 0" dur="22s" repeatCount="indefinite"/></circle>
  <circle cx="505" cy="145" r="1.3" opacity=".24"><animateTransform attributeName="transform" type="translate" values="0 0;-14 7;10 -14;20 9;0 0" dur="17s" repeatCount="indefinite"/></circle>
  <circle cx="575" cy="35" r="1.8" opacity=".32"><animateTransform attributeName="transform" type="translate" values="0 0;16 -6;-6 18;-20 3;0 0" dur="20s" repeatCount="indefinite"/></circle>
  <circle cx="630" cy="118" r="1.2" opacity=".23"><animateTransform attributeName="transform" type="translate" values="0 0;-10 -16;18 6;-5 14;0 0" dur="24s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="55" r="1.5" opacity=".3"><animateTransform attributeName="transform" type="translate" values="0 0;15 10;-12 -8;7 18;0 0" dur="18s" repeatCount="indefinite"/></circle>
  <circle cx="770" cy="115" r="1.7" opacity=".35"><animateTransform attributeName="transform" type="translate" values="0 0;-20 -7;8 17;16 -10;0 0" dur="21s" repeatCount="indefinite"/></circle>
  <circle cx="820" cy="70" r="1.2" opacity=".25"><animateTransform attributeName="transform" type="translate" values="0 0;8 16;-16 -5;12 -12;0 0" dur="16s" repeatCount="indefinite"/></circle>
</g>

<text x="450" y="78" text-anchor="middle" fill="#fff" font-family="monospace" font-size="38" font-weight="700" letter-spacing="4">HYPRSETUPS
  <animate attributeName="opacity" values=".78;1;.78" dur="4s" repeatCount="indefinite"/>
</text>
<text x="450" y="112" text-anchor="middle" fill="#fff" fill-opacity=".65" font-family="monospace" font-size="15" letter-spacing="2">// HYPRLAND RICE COLLECTION
  <animate attributeName="opacity" values=".45;.75;.45" dur="4s" repeatCount="indefinite"/>
</text>
<path d="M120 140H780" stroke="#fff" stroke-opacity=".18"/>
<circle r="3" fill="#fff">
  <animateMotion dur="6s" repeatCount="indefinite" path="M120 140H780"/>
  <animate attributeName="r" values="2;4;2" dur="1.5s" repeatCount="indefinite"/>
</circle>
<circle r="3" fill="#fff">
  <animateMotion dur="6s" begin="3s" repeatCount="indefinite" path="M780 140H120"/>
  <animate attributeName="r" values="2;4;2" dur="1.5s" begin=".75s" repeatCount="indefinite"/>
</circle>
</svg>
