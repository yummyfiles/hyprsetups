<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GitHub Stats Settings</title>
  <style>
    :root {
      --bg: #000000;
      --fg: #ffffff;
      --dim: #8a8a8a;
      --panel: #0d0d0d;
      --edge: #2a2a2a;
      --font: "JetBrainsMono Nerd Font", "JetBrains Mono", monospace;
    }
    * { box-sizing: border-box; }
    body, input, button, textarea, select { font-family: var(--font); }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      height: 100%;
    }
    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    .brand {
      text-align: center;
      font-family: var(--font);
      font-size: 64px;
      line-height: 1;
      margin-bottom: 26px;
      color: var(--fg);
      -webkit-user-select: none;
      user-select: none;
    }
    .gh-card {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 30px;
      background: var(--panel);
      border: 1px solid var(--edge);
    }
    .gh-header {
      font-size: 12px;
      letter-spacing: .3em;
      color: var(--dim);
      text-transform: uppercase;
    }
    .gh-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--edge);
      color: var(--fg);
      font-family: var(--font);
      font-size: 15px;
      letter-spacing: .08em;
      outline: none;
    }
    .gh-input:focus { border-color: var(--fg); }
    .gh-input::placeholder { color: #6f6f6f; }
    .gh-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .gh-btn {
      flex: 1;
      padding: 12px 0;
      background: var(--fg);
      border: none;
      color: var(--bg);
      font-family: var(--font);
      font-size: 14px;
      letter-spacing: .12em;
      cursor: pointer;
    }
    .gh-btn.ghost {
      background: none;
      border: 1px solid var(--edge);
      color: var(--fg);
    }
    .gh-btn:hover { border-color: var(--fg); }
    .gh-status {
      margin-top: 20px;
      padding: 10px;
      background: var(--bg);
      border-left: 3px solid var(--fg);
      font-size: 13px;
      font-style: italic;
      color: var(--dim);
    }
    .back {
      margin-top: 18px;
      text-align: center;
    }
    .back a {
      color: var(--dim);
      font-size: 12px;
      letter-spacing: .18em;
      text-decoration: none;
      border-bottom: 1px dashed #444;
    }
    .back a:hover { color: var(--fg); border-bottom-color: var(--fg); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">󰊤</div>
    <div class="gh-card">
      <div class="gh-header">GITHUB STATS</div>
      <div>
        <input class="gh-input" id="ghUser" type="text" placeholder="GitHub username (e.g., torvalds)">
      </div>
      <div class="gh-actions">
        <button class="gh-btn" id="ghSave">SAVE</button>
        <button class="gh-btn ghost" id="ghCancel">CANCEL</button>
      </div>
      <div class="gh-status" id="ghStatus"></div>
    </div>
    <div class="back"><a href="startpage.html">← back to startpage</a></div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
